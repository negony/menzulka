[package]
name = "menzulka_cad"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Нативный слой конвертации DWG → DXF для приложения «Мензулка»"

[lib]
name = "menzulka_cad"
crate-type = ["cdylib", "rlib"]

[dependencies]
# acadrust — независимая реализация DWG/DXF, MPL-2.0 (см. THIRD_PARTY_NOTICES.md).
# Версия закреплена: патчей не вносим, при необходимости — публикуем их отдельно.
acadrust = "=0.6.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
