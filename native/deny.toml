# Правила аудита лицензий и зависимостей нативного слоя.
# Запуск: cargo deny check licenses bans sources
[licenses]
# Разрешены только разрешительные лицензии и MPL-2.0 (сам acadrust).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Запрещаем GPL/AGPL: использовать в закрытом продукте нельзя.
deny = [
    { name = "libredwg", reason = "GPLv3 — несовместимо с MIT-приложением" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
