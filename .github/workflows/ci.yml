name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          # Версия закреплена под проект: в новых stable `package:flutter/material.dart`
          # объявлен устаревшим, и анализ на другой версии даёт ложные замечания.
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Статический анализ
        run: flutter analyze

      - name: Тесты
        run: flutter test --reporter expanded

  native:
    name: Нативный слой DWG
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш сборки Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Сборка и тесты библиотеки
        run: |
          cargo test --manifest-path native/Cargo.toml
          cargo build --release --manifest-path native/Cargo.toml

      - name: Проверка лицензий зависимостей
        run: |
          cargo install cargo-deny --locked
          cargo deny --manifest-path native/Cargo.toml check licenses bans sources
