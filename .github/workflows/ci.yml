name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Статический анализ
        run: flutter analyze

      - name: Тесты
        run: flutter test --reporter expanded
